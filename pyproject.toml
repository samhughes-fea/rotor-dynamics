[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotor-dynamics"
version = "0.1.0"
description = "Assemble a rotor from blade modal models, a hub and shaft, and aerodynamic loads"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sam Hughes", email = "s.hughes@ed.ac.uk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/samhughes-fea/rotor-dynamics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotor_dynamics = ["py.typed"]
